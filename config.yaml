# Configuração global
fps: 15
quality: 5

# Configuração AMQP global
amqp:
  url: "amqp://t3-labs:vTUaGG9S0Kbl_1AhqPxudML1jCYHRq0efkRDA6p_lgM@34.71.212.239:5672/t3-labs"
  prefetch_count: 50
  publisher_confirms: false

# Circuit Breaker e Memory Controller (manter padrão)
circuit_breaker:
  enabled: true
  max_failures: 5
  reset_timeout: 30s
  half_open_successes: 3
  initial_backoff: 5s
  max_backoff: 5m
  backoff_multiplier: 2.0

memory_controller:
  enabled: false
  max_memory_mb: 2048
  warning_percent: 60.0
  critical_percent: 75.0
  emergency_percent: 85.0
  check_interval: 5s
  gc_trigger_percent: 70.0

# Resilience (Watchdog e Recovery)
resilience:
  watchdog_timeout: 15s      # Tempo sem frames antes de reiniciar (Stall detection)
  initial_grace_period: 20s  # Tempo de carência ao iniciar

# Worker Pool (Concorrência por câmera)
worker_pool:
  size: 10                   # Uploaders simultâneos p/ Redis por câmera (Aumentado p/ saturar throughput)

# Redis (Importante: manter igual ao consumer!)
redis:
  enabled: true
  address: "34.30.59.236:6379"
  password: "MinhaSenhaMuitoForte@2024"
  db: 0
  pool_size: 20              # Pool de conexões (Default: 10 * CPU). Aumentar para alta concorrência.
  vhost: "supercarlao_rj_mercado"
  prefix: "frames"
  ttl: 120s
  max_retries: 3
  retry_delay: 100ms
  timeout: 2s

metadata:
  enabled: false
  include_redis_key: true

monitoring:
  metrics_port: 2112
  pprof_port: 6060
  auto_port: true

# Câmeras
cameras:
  - id: "teste-nic"
    url: "rtsp://shopguard:!Sg36786@191.7.178.101:8554/cam/realmonitor?channel=4&subtype=0"
    exchange: "supercarlao_rj_mercado.exchange"     # <--- Consumer espera isso
    routing_key: "supercarlao_rj_mercado.teste-nic" # <--- Consumer espera isso

  # Outras câmeras antigas...
  - id: "cam1"
    url: "rtmp://str-rtmp-001.monuv.com.br:1935/rtmp/96159.stream"
    exchange: "supercarlao_rj_mercado.exchange"
